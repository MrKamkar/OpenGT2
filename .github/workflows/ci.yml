name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload GitHub Pages artifact
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main' &&
          vars.DEPLOY_TARGET != 'none' &&
          (vars.DEPLOY_TARGET == '' || vars.DEPLOY_TARGET == 'github-pages')
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: ci
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_TARGET != 'none' &&
      (vars.DEPLOY_TARGET == '' || vars.DEPLOY_TARGET == 'github-pages')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    name: Post-Deploy Smoke Test (Playwright)
    needs: deploy
    if: >-
      needs.deploy.result == 'success' &&
      needs.deploy.outputs.page_url != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for GitHub Pages availability
        env:
          TARGET_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          for attempt in $(seq 1 12); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$TARGET_URL" || true)
            if [ "$status" = "200" ]; then
              echo "GitHub Pages responded 200 on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt returned HTTP $status, retrying in 5s..."
            sleep 5
          done
          echo "GitHub Pages did not respond 200 within timeout"
          exit 1

      - name: Run Playwright smoke tests on GitHub Pages
        env:
          E2E_BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: npm run test:e2e
